publish_to: 'none'

version: 2.0.0+4

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.3
  path: ^1.9.1
  google_fonts: ^6.2.1
  fl_chart: ^0.70.2
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  google_sign_in: ^6.2.1
